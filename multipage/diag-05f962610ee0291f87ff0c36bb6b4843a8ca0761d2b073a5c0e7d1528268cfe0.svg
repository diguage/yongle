  <title>blockdiag</title>
  <desc>seqdiag {
  edge_length = 200;  // default value is 192
  default_fontsize = 14;  // default value is 11

  browser  -&gt; webserver [label = "GET /seqdiag/svg/base64", note = "\n测试\n_"];
  webserver  =&gt; processor [label = "Convert text to image", leftnote = "\n测试\n_"];
  browser &lt;-- webserver;

=== D瓜哥 · https://www.diguage.com · 出品 ===
}</desc>
